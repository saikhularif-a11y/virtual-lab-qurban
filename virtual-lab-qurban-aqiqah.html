function menuT(){if(mode!='play')return;if(lock)hide();else show('<h2>⏸ Menu Jeda</h2><button class=b onclick=hide()>▶ Lanjutkan</button><button class=b onclick=help()>Petunjuk</button><button class=b onclick=skor()>Papan Skor</button><button class="b g" onclick=home()>Menu Utama</button>')}
function home(){hide();mode='login';document.body.classList.remove('pl');const l=$('#lg');l.style.display='flex';setTimeout(()=>l.classList.remove('out'),30)}
function help(){show('<h2>📖 Petunjuk</h2><ul><li>💻 Laptop: W/A/S/D atau panah = bergerak, Shift = lari, Spasi = lompat, seret mouse = putar kamera, E = interaksi, Esc = menu.</li><li>📱 HP: joystick kiri bawah, tombol INTERAKSI &amp; LOMPAT kanan bawah, geser layar untuk memutar kamera, MENU di kanan atas.</li><li>Dekati pos ⭐ lalu tekan E / INTERAKSI. Ketuk hewan untuk melihat infonya. Kumpulkan poin dari pos, labirin, dan kuis!</li></ul><button class=b onclick=hide()>Tutup</button>')}
function skor(){const n=[1,2,3,4,5,6].filter(i=>S.d[i]).length;show(`<h2>🏆 Papan Skor</h2><p>${esc(S.n)} · Kelas ${esc(S.k)}</p><p>Total poin: <b>${S.p}</b><br>Pos diselesaikan: <b>${n}/6</b><br>Skor kuis terbaik: <b>${S.q}/150</b><br>Labirin: ${S.d.m?'✅ selesai':'belum'}</p><p>${n==6?'🏅 Lencana Penjelajah Fikih!':'Selesaikan semua pos untuk meraih lencana.'}</p><button class=b onclick=hide()>Tutup</button>`)}
function tch(){show(`<h2>👨‍🏫 Guru PAI</h2><p>Assalamu'alaikum, selamat datang, <b>${esc(S.n)}</b>!</p><p>Selamat datang di Virtual Lab Qurban &amp; Aqiqah. Hari ini kita akan menjelajahi dunia qurban dan aqiqah, mempelajari ketentuannya, mengenal hewan yang sah, serta memahami tata cara penyembelihan sesuai syariat Islam.</p><p>Ayo, jelajahi setiap pos pembelajaran dan kumpulkan poin sebanyak-banyaknya!</p><button class=b onclick="hide();toast('Temukan 6 pos bertanda ⭐ di dunia virtual!')">MULAI PETUALANGAN</button><button class=b onclick=help()>PELAJARI PETUNJUK</button><button class="b g" onclick=hide()>NANTI SAJA</button>`)}
function act(){if(mode!='play'||lock||!near)return;openSt(near.id)}
const stp=['Pastikan hewan sehat dan memenuhi syarat qurban/aqiqah.','Siapkan alat yang tajam, bersih, dan aman; asah sebelum hewan didekatkan.','Perlakukan hewan dengan lembut, beri minum, jangan menyiksanya.','Arahkan hewan dengan tenang; dianjurkan menghadap kiblat.','Baca "Bismillahi, Allahu Akbar" (qurban boleh ditambah doa qurban).','Penyembelihan dilakukan cepat oleh orang yang kompeten, memutus saluran napas dan saluran makan (minimal) menurut fikih.','Tunggu hewan benar-benar tenang sebelum diproses lebih lanjut.','Jaga kebersihan, keselamatan, dan limbah area.'];
const C={1:`<h2>Pos 1 · Pengertian Qurban &amp; Aqiqah</h2><p><b>Qurban</b>: secara bahasa dari <i>qaraba</i> (mendekatkan diri). Secara istilah, menyembelih hewan ternak tertentu pada Idul Adha (10 Dzulhijjah) dan hari tasyrik (11–13) sebagai ibadah kepada Allah. Hukumnya sunnah muakkadah menurut jumhur ulama (mazhab Hanafi: wajib bagi yang mampu).</p><p><b>Aqiqah</b>: sembelihan sebagai wujud syukur atas kelahiran anak; hukumnya sunnah muakkadah menurut jumhur ulama.</p><div class=ar>فَصَلِّ لِرَبِّكَ وَانْحَرْ</div><p><i>Fa shalli li rabbika wanhar.</i> “Maka laksanakanlah salat karena Tuhanmu, dan berqurbanlah.” (QS. Al-Kautsar: 2)</p><ul><li><b>Beda:</b> qurban terikat waktu Idul Adha; aqiqah terkait kelahiran anak.</li><li><b>Hikmah:</b> ketakwaan, syukur, meneladani Nabi Ibrahim, berbagi dengan sesama.</li></ul>`,
2:`<h2>Pos 2 · Ketentuan Hewan Qurban</h2><ul><li><b>Jenis:</b> unta, sapi/kerbau, kambing, dan domba (hewan ternak; QS. Al-Hajj: 34).</li><li><b>Umur minimal</b> (pendapat yang umum, mazhab Syafi'i): unta 5 tahun, sapi 2 tahun, kambing 2 tahun, domba 1 tahun. Rincian umur dapat berbeda antarulama.</li><li><b>Sehat &amp; tidak cacat:</b> tidak sah bila buta sebelah yang jelas, sakit jelas, pincang jelas, atau sangat kurus (HR. Abu Dawud dan At-Tirmidzi).</li><li><b>Jumlah:</b> 1 kambing/domba untuk 1 orang (pahalanya boleh meliputi keluarganya); 1 sapi/unta untuk 7 orang (HR. Muslim).</li><li><b>Waktu:</b> setelah salat Idul Adha (10 Dzulhijjah) hingga akhir hari tasyrik (13 Dzulhijjah) menurut pendapat yang umum.</li><li><b>Pembagian:</b> sebagian dimakan shohibul qurban, sebagian disedekahkan kepada fakir miskin; pola sepertiga bukan satu-satunya ketentuan. Upah penyembelih tidak diambil dari daging qurban.</li></ul><p>💡 Ketuk/klik hewan di kandang untuk melihat infonya.</p>`,
3:`<h2>Pos 3 · Ketentuan Aqiqah</h2><ul><li><b>Hukum:</b> sunnah muakkadah menurut jumhur ulama.</li><li><b>Waktu:</b> dianjurkan hari ketujuh kelahiran; bila terlewat, sebagian ulama membolehkan di hari lain.</li><li><b>Hewan:</b> kambing, dengan syarat umumnya seperti hewan qurban (sehat dan tidak cacat); sebagian ulama membolehkan sapi/unta.</li><li><b>Jumlah:</b> anak laki-laki dua kambing, anak perempuan satu kambing.</li><li><b>Pengolahan:</b> dianjurkan dimasak lalu dibagikan kepada tetangga dan fakir miskin; keluarga boleh ikut makan. Ulama memiliki rincian yang beragam.</li><li><b>Hikmah:</b> syukur, berbagi kebahagiaan, mempererat silaturahmi, mendoakan anak.</li></ul><div class=ar>عَنِ الْغُلَامِ شَاتَانِ مُكَافِئَتَانِ وَعَنِ الْجَارِيَةِ شَاةٌ</div><p>“Untuk anak laki-laki dua ekor kambing yang sepadan, dan untuk anak perempuan satu ekor kambing.” (HR. Ahmad dan At-Tirmidzi dari 'Aisyah r.a.)</p><div class=ar>كُلُّ غُلَامٍ مُرْتَهَنٌ بِعَقِيقَتِهِ تُذْبَحُ عَنْهُ يَوْمَ سَابِعِهِ وَيُحْلَقُ وَيُسَمَّى</div><p>“Setiap anak tergadai dengan aqiqahnya; disembelih pada hari ketujuh, dicukur rambutnya, dan diberi nama.” (HR. Abu Dawud, At-Tirmidzi, An-Nasa'i, Ibnu Majah dari Samurah r.a.)</p>`,
4:`<h2>Pos 4 · Tata Cara Penyembelihan</h2><p>Demonstrasi simbolis (tanpa visual grafis). Langkah menyala bergantian:</p><ol class=st>${stp.map((s,i)=>`<li style="animation-delay:${i*1.5}s">${s}</li>`).join('')}</ol><p>“Sesungguhnya Allah mewajibkan ihsan atas segala sesuatu… jika kalian menyembelih, sembelihlah dengan baik; tajamkanlah pisaunya dan senangkanlah hewan sembelihannya.” (HR. Muslim)</p><p><b>Beribadah dengan benar, memperlakukan hewan dengan ihsan, serta menjaga kebersihan dan keselamatan.</b></p>`,
5:`<h2>Pos 5 · Pembagian Daging</h2><ul><li><b>Tujuan:</b> berbagi kebahagiaan, peduli sesama, mempererat persaudaraan.</li><li><b>Penerima daging qurban:</b> shohibul qurban dan keluarga, fakir miskin, tetangga, dan kerabat.</li><li><b>Adab:</b> adil, bersih, rapi, amanah, diantar dengan sopan; utamakan yang paling membutuhkan.</li><li><b>Qurban vs aqiqah:</b> daging qurban umumnya dibagikan mentah, hidangan aqiqah dianjurkan dimasak. Pola pembagian beragam menurut ulama; tidak ada satu pola yang dianggap satu-satunya.</li></ul>`};
function openSt(id){if(id=='t')return tch();if(id=='s')return skor();if(id=='x')return show('<h2>🚪 Gerbang Keluar</h2><p>Kembali ke menu utama? Progres tersimpan.</p><button class=b onclick=home()>Ya</button><button class="b g" onclick=hide()>Batal</button>');if(id==6)return quiz();
if(!S.d[id]){S.d[id]=1;aw(10)}show(C[id]+'<p><button class=b onclick=hide()>Tutup</button>'+(id==5?'<button class=b onclick=maze()>🧩 Main Labirin Pengantaran</button>':'')+'</p>')}
const Q=[["Secara bahasa, qurban berarti…","mendekatkan diri","membersihkan diri","menjauhi larangan","membagi rezeki","Qurban dari kata qaraba: mendekatkan diri kepada Allah."],
["Ayat yang memerintahkan salat dan berqurban adalah…","QS. Al-Kautsar ayat 2","QS. Al-Ikhlas ayat 1","QS. Al-Fatihah ayat 5","QS. Al-Baqarah ayat 183","Al-Kautsar: 2 — Fa shalli li rabbika wanhar."],
["Penyembelihan qurban dilakukan setelah salat Id hingga…","akhir hari tasyrik (13 Dzulhijjah)","tanggal 9 Dzulhijjah","akhir bulan Muharram","awal Ramadhan","Menurut pendapat yang umum, waktunya sampai akhir hari tasyrik."],
["Hewan yang sah untuk qurban adalah…","unta, sapi, kambing, dan domba","ayam, bebek, dan ikan","kelinci, kuda, dan burung","rusa liar dan kijang","Qurban memakai hewan ternak: unta, sapi/kerbau, kambing, domba."],
["Satu ekor sapi dapat dipakai qurban untuk…","tujuh orang","satu orang","tiga orang","sepuluh orang","Sapi dan unta untuk tujuh orang (HR. Muslim)."],
["Hewan yang TIDAK sah untuk qurban adalah…","yang pincang jelas pincangnya","yang sehat dan gemuk","yang cukup umur","yang jantan dan sehat","Cacat jelas (pincang, buta sebelah, sakit, sangat kurus) tidak sah."],
["Satu ekor kambing sah untuk qurban…","satu orang (pahala boleh meliputi keluarga)","tujuh orang","sepuluh orang","satu RT","Kambing/domba untuk satu orang."],
["Menurut hadis, aqiqah anak laki-laki berupa…","dua ekor kambing","satu ekor sapi","empat ekor kambing","tidak ada ketentuan","Laki-laki dua kambing, perempuan satu kambing."],
["Aqiqah dianjurkan pada hari ke…","tujuh kelahiran","satu","empat puluh","seratus","Hadis Samurah: disembelih pada hari ketujuh."],
["Hukum aqiqah menurut jumhur ulama adalah…","sunnah muakkadah","wajib 'ain","haram","mubah saja","Jumhur ulama: sunnah muakkadah."],
["Aqiqah berkaitan dengan…","kelahiran anak","hari raya Idul Adha","pernikahan","pindah rumah","Qurban terkait Idul Adha; aqiqah terkait kelahiran."],
["Bacaan sebelum menyembelih adalah…","Bismillahi, Allahu Akbar","Alhamdulillah","Astaghfirullah","Subhanallah","Disunnahkan membaca basmalah dan takbir."],
["Contoh sikap ihsan kepada hewan adalah…","menajamkan pisau dan tidak menyiksa hewan","menyembelih di depan hewan lain","memakai pisau tumpul","membiarkan hewan kelaparan","HR. Muslim: tajamkan pisau dan senangkan hewan sembelihan."],
["Daging qurban sebaiknya…","dimakan, dihadiahkan, dan disedekahkan","dijual seluruhnya","hanya untuk orang kaya","dijadikan upah penyembelih","Upah penyembelih tidak diambil dari daging qurban."],
["Hidangan aqiqah dianjurkan…","dimasak lalu dibagikan","dijual","dibuang","tidak boleh dimakan keluarga","Dianjurkan dimasak dan dibagikan; ulama berbeda dalam rinciannya."]];
function quiz(){const qs=shuf(Q).map(q=>({q:q[0],a:q[1],e:q[5],o:shuf(q.slice(1,5))}));let i=0,pt=0,dn=0;
const r=()=>{if(i>=qs.length){const dl=Math.max(0,pt-S.q);S.q+=dl;S.d[6]=1;aw(dl);return show(`<h2>🏆 Kuis Selesai</h2><p>Skor: <b>${pt}</b>/${qs.length*10}</p><p>${pt>=100?'Masya Allah, luar biasa!':'Ayo pelajari lagi pos-pos materi, lalu coba lagi.'}</p><button class=b onclick=quiz()>Ulangi</button><button class="b g" onclick=hide()>Tutup</button>`)}
const q=qs[i];dn=0;show(`<h2>Pos 6 · Kuis Tantangan Fikih</h2><div class=bar><i style="width:${i/qs.length*100}%"></i></div><p>Soal ${i+1}/${qs.length} · Skor ${pt}</p><p><b>${q.q}</b></p>`+q.o.map((o,k)=>`<button class="b o" onclick="ans(${k})">${o}</button>`).join('')+'<div id=fb></div>')};
window.ans=k=>{if(dn)return;dn=1;const q=qs[i],ok=q.o[k]==q.a;if(ok)pt+=10;document.querySelectorAll('.o').forEach((b,j)=>{b.disabled=1;if(q.o[j]==q.a)b.classList.add('ok');else if(j==k)b.classList.add('no')});$('#fb').innerHTML=`<p><b>${ok?'✅ Benar!':'❌ Kurang tepat.'}</b> ${q.e}</p><button class=b onclick=nx()>${i+1<qs.length?'Soal Berikutnya ➜':'Lihat Hasil'}</button>`};window.nx=()=>{i++;r()};r()}
function maze(){const N=8,cs=36,dr=[[0,-1],[1,0],[0,1],[-1,0]],g=[...Array(N)].map(()=>[...Array(N)].map(()=>({w:[1,1,1,1],v:0})));
(function f(x,y){g[y][x].v=1;shuf([0,1,2,3]).forEach(d=>{const nx=x+dr[d][0],ny=y+dr[d][1];if(nx>=0&&ny>=0&&nx<N&&ny<N&&!g[ny][nx].v){g[y][x].w[d]=0;g[ny][nx].w[(d+2)%4]=0;f(nx,ny)}})})(0,0);
const hs=[[7,1,'Daging qurban yang kamu antar diutamakan untuk…','fakir miskin, tetangga, dan kerabat','orang yang sudah berkecukupan saja'],[1,7,'Hidangan aqiqah umumnya dianjurkan…','dimasak lalu dibagikan','dijual ke pasar'],[7,7,'Adab membagikan daging adalah…','adil, bersih, dan amanah','pilih kasih dan asal lempar']].map(h=>({x:h[0],y:h[1],q:h[2],a:h[3],b:h[4],d:0})),p={x:0,y:0};let cur=null;
show(`<h2>🧩 Labirin Pengantaran</h2><p>Antar 3 paket daging ke rumah 🏠 (panah/WASD atau tombol). Jawab pertanyaan di tiap rumah.</p><canvas id=mz width=288 height=288></canvas><div class=dp><i></i><button class=b onclick=mzm(0)>▲</button><i></i><button class=b onclick=mzm(3)>◀</button><button class=b onclick=mzm(2)>▼</button><button class=b onclick=mzm(1)>▶</button></div><div id=mzq></div><button class="b g" onclick=hide()>Tutup</button>`);
const cx=$('#mz').getContext('2d');
function dw(){cx.clearRect(0,0,288,288);cx.strokeStyle='#2f5d46';cx.lineWidth=3;cx.beginPath();g.forEach((row,y)=>row.forEach((c,x)=>{const X=x*cs,Y=y*cs;if(c.w[0]){cx.moveTo(X,Y);cx.lineTo(X+cs,Y)}if(c.w[1]){cx.moveTo(X+cs,Y);cx.lineTo(X+cs,Y+cs)}if(c.w[2]){cx.moveTo(X,Y+cs);cx.lineTo(X+cs,Y+cs)}if(c.w[3]){cx.moveTo(X,Y);cx.lineTo(X,Y+cs)}}));cx.stroke();cx.font='22px serif';cx.textAlign='center';cx.textBaseline='middle';
hs.forEach(h=>cx.fillText(h.d?'✅':'🏠',h.x*cs+cs/2,h.y*cs+cs/2));cx.fillText('🧑',p.x*cs+cs/2,p.y*cs+cs/2)}
window.mzm=d=>{if(cur||g[p.y][p.x].w[d])return;p.x+=dr[d][0];p.y+=dr[d][1];const h=hs.find(h=>!h.d&&h.x==p.x&&h.y==p.y);dw();if(h){cur=h;const o=shuf([h.a,h.b]);$('#mzq').innerHTML=`<p><b>${h.q}</b></p>`+o.map(t=>`<button class="b o" onclick="mzA(${t==h.a})">${t}</button>`).join('')}};
window.mzA=ok=>{if(!ok){toast('Belum tepat, coba pikirkan lagi 🙂');return}cur.d=1;cur=null;aw(10);dw();$('#mzq').innerHTML='<p>✅ Paket terkirim! +10 poin</p>';if(hs.every(h=>h.d)){if(!S.d.m){S.d.m=1;aw(10)}$('#mzq').innerHTML='<p><b>🎉 Semua paket terkirim! Bonus +10 poin.</b></p>'}};dw()}
/* login */
$('#nm').value=S.n;$('#kl').value=S.k;hud();
$('#hl').onclick=help;
$('#go').onclick=()=>{const n=$('#nm').value.trim(),k=$('#kl').value.trim();if(n.length<3||!k){$('#er').textContent='Isi nama lengkap (min. 3 huruf) dan kelas terlebih dahulu.';return}
S.n=n;S.k=k;sv();hud();$('#er').textContent='';$('#lg').classList.add('out');setTimeout(()=>{$('#lg').style.display='none'},900);document.body.classList.add('pl');mode='play';P.x=0;P.z=14;P.a=Math.PI;yaw=0;toast('Halo, '+esc(n)+'! Temui Guru PAI di pendopo 👨‍🏫')};
</script></body></html>
